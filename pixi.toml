[workspace]
name = "jazzy_ws"
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
requires-pixi = ">=0.68.0"
platforms = [
    { platform = "linux-64", glibc = "2.35", cuda = "13.0" },
]

[dependencies]
# Base ROS dependencies
pkg-config = ">=0.29.2,<0.30"
compilers = ">=2.0.0,<3"
make = ">=4.4.1,<5"
ninja = ">=1.13.2,<2"

# Build tools (kept so future packages build without re-solving the world)
colcon-common-extensions = ">=0.3.0,<0.4"
cmake = ">=4.4.4,<5"

# RMW: Zenoh is the default (see [activation.env]), Fast DDS as fallback
ros-jazzy-rmw-zenoh-cpp = ">=0.2.11,<0.3"
ros-jazzy-rmw-fastrtps-cpp = ">=8.4.4,<9"

# Foxglove bridge (present in robostack-jazzy, no apt needed)
ros-jazzy-foxglove-bridge = ">=3.6.0,<4"

# Test runner for `pixi run test`
pytest = ">=9.1.1,<10"

# Needed as it uses the Sentinel
typing-extensions = ">=4.16.0,<5"
ros-jazzy-teleop-twist-keyboard = ">=2.4.1,<3"
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-xacro = ">=2.1.1,<3"
ros-jazzy-robot-state-publisher = ">=3.3.4,<4"
ros-jazzy-joint-state-publisher = ">=2.4.3,<3"
ros-jazzy-joint-state-publisher-gui = ">=2.4.3,<3"

[pypi-options]
extra-index-urls = ["https://pypi.nvidia.com"]

# These are required to avoid the pypi solver to be confused about
# the already installed dependencies from the conda side.
[pypi-options.dependency-overrides]
opencv-python-headless = "*"
typing-extensions = "*"
numpy = "*"
cryptography = "*"
packaging = "*"
mujoco-usd-converter = "*"
psutil = "*"
jinja2 = "*"
coverage = "*"
pillow = "*"
tinyobjloader = "*"
# Pytorch related:
mpmath = "*"
fsspec = "*"
filelock = "*"

[pypi-dependencies]
torch = { version = "*", index = "https://download.pytorch.org/whl/cu128" }


[tasks]
# ROS
build = { cmd = "colcon build --merge-install --cmake-args -DBUILD_TESTING=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPython_FIND_VIRTUALENV=ONLY -DPython3_FIND_VIRTUALENV=ONLY", description = "Build the ROS workspace" }
build-scout = { cmd = "colcon build --symlink-install --packages-up-to scout_with_piper_description", description = "Build scout_description and scout_with_piper_description with symlink install" }
build-nav = { cmd = "colcon build --symlink-install --packages-up-to scout_piper_nav", description = "Build scout_piper_nav with symlink install" }
test = {cmd = "colcon test", description = "Run tests for the workspace"}
clean = {cmd = "rm -rf build install log", description = "Clean build artifacts (build, install, log directories)"}
zenoh = "ros2 run rmw_zenoh_cpp rmw_zenohd"

# Isaacsim (expects a local install at $isaac_sim_package_path, e.g. ~/isaacsim
# symlinked to /mnt/<hdd>/isaacsim; installed separately, not via pixi)
check = "$isaac_sim_package_path/isaac-sim.compatibility_check.sh"

# The ROS 2 bridge needs libyaml.so and the jazzy type-support libraries.
# Pixi does not add $CONDA_PREFIX/lib to LD_LIBRARY_PATH, and the launcher
# deliberately strips the conda prefix, so point at the copies Isaac Sim
# The ROS 2 bridge resolves its RMW through librmw.so, the dispatcher, so any
# RMW works. It does not ship rmw_zenoh_cpp, though: scripts/isaac_ros_env.sh
# exposes the Zenoh libraries from the conda env through a shim directory. The
# shim must not be replaced by putting $CONDA_PREFIX/lib on LD_LIBRARY_PATH —
# conda's libz breaks the embedded CPython and the app aborts at startup.
sim = "bash scripts/isaac_ros_env.sh $isaac_sim_package_path/isaac-sim.sh --/isaac/startup/ros_bridge_extension=isaacsim.ros2.bridge"
headless = "bash scripts/isaac_ros_env.sh $isaac_sim_package_path/isaac-sim.streaming.sh --/isaac/startup/ros_bridge_extension=isaacsim.ros2.bridge"

# Launch Isaac Sim as a managed ROS 2 node instead of a raw process. Adds the
# stage, headless, and enable_ros2_bridge arguments on top of the raw task.
bringup = "bash scripts/isaac_ros_env.sh ros2 launch isaacsim_bringup run_isaacsim.launch.xml"

# Scripts to source on environment activation, found after first colcon build.
[activation.env]
ROS_DOMAIN_ID="0"
ROS_DISTRO = "jazzy"
KMP_DUPLICATE_LIB_OK = "TRUE"

[target.unix.activation]
scripts = ["install/setup.bash", "scripts/rmw_env.sh"]
env = { isaac_sim_package_path = "$HOME/isaacsim" }
