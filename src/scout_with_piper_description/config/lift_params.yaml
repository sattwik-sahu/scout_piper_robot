# Telescoping linear actuator dimensions.
#
# Only the actuator dimensions and its mount live here. Tube length and the
# prismatic travel limit are DERIVED from the two heights, so they are not
# stated directly:
#
#   tube_length = home_height - platform.xyz[2]
#   travel      = max_height  - home_height
#
# Heights are measured above the actuator's own mount point (the tube base).
# Lengths in meters, angles in radians.
#
# Override any value on the command line, e.g.
#   ros2 launch scout_with_piper_description description.launch.py \
#       lift_home_height:=0.40 lift_max_height:=0.80
# or point at a different file:
#   ros2 launch ... lift_params_file:=/path/to/other.yaml

lift:
  # ---- Where the tube attaches -------------------------------------------
  mount:
    parent_link: base_link        # any link name present in the tree
    xyz: [0.25, 0.0, 0.11]       # mount position in the parent frame
    rpy: [0.0, 0.0, 0.0]          # mount orientation

  # ---- Payload heights above the mount point ------------------------------
  home_height: 0.30               # rod fully retracted
  max_height: 0.55                # rod fully extended

  # ---- Payload riding the rod --------------------------------------------
  platform:
    link: piper_base_link
    xyz: [0.0, 0.0, 0.02]         # payload offset from the rod top face